<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MT5 复盘</title>
    <script>
      // Compatibility redirect: legacy deep links keep working.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var trade = params.get("trade");
        var campaign = params.get("campaign");
        var target;
        if (trade || campaign) {
          target = "/orders/?" + params.toString();
        } else {
          target = "/dashboard/";
        }
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
