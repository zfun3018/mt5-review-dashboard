<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设置 · MT5 复盘</title>
    <link rel="stylesheet" href="../shared/css/tokens.css" />
    <link rel="stylesheet" href="../shared/css/base.css" />
    <link rel="stylesheet" href="../shared/css/shell.css" />
    <link rel="stylesheet" href="../shared/css/components.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <div data-app-shell>
      <section class="panel settings-shell" aria-label="系统设置">
        <div class="settings-tabs" role="tablist" aria-label="设置分类">
          <button class="settings-tab is-active" type="button" role="tab" data-settings-tab="classifications" aria-selected="true">分类与字段</button>
          <button class="settings-tab" type="button" role="tab" data-settings-tab="analysis" aria-selected="false">分析设置</button>
          <button class="settings-tab" type="button" role="tab" data-settings-tab="data" aria-selected="false">数据与状态</button>
        </div>

        <div class="settings-panel" data-settings-panel="classifications" role="tabpanel">
          <div class="settings-section">
            <div class="settings-section-head">
              <div>
                <p class="eyebrow">CLASSIFICATIONS</p>
                <h2>分类管理</h2>
              </div>
                <p class="settings-hint">停用后会从订单、仪表盘和画册中隐藏，历史数据仍保留，可随时恢复。</p>
            </div>
            <div id="classificationManager" class="classification-manager"></div>
          </div>

          <div class="settings-section">
            <div class="settings-section-head">
              <div>
                <p class="eyebrow">CUSTOM FIELDS</p>
                <h2>自定义字段</h2>
              </div>
            </div>
            <div class="settings-field-create">
              <input id="newCustomFieldName" type="text" placeholder="字段名称" maxlength="40" />
              <select id="newCustomFieldType">
                <option value="text">文本</option>
                <option value="single">单选</option>
                <option value="multi">多选</option>
              </select>
              <button id="addCustomField" class="button-primary" type="button">新增字段</button>
            </div>
            <div id="customFieldSchema" class="custom-field-schema"></div>
          </div>
        </div>

        <div class="settings-panel" data-settings-panel="analysis" role="tabpanel" hidden>
          <div class="settings-section">
            <div class="settings-section-head">
              <div>
                <p class="eyebrow">SCRATCH THRESHOLD</p>
                <h2>打平（Scratch）阈值</h2>
              </div>
            </div>
            <p class="settings-hint">持仓 R 的绝对值不高于该阈值时，视为“打平”交易。用于订单列表与分析的 Scratch 标记。</p>
            <div class="settings-threshold-row">
              <label for="scratchThresholdR">阈值 R</label>
              <input id="scratchThresholdR" type="number" step="0.01" min="0" max="5" />
              <button id="saveScratchThreshold" class="button-primary" type="button">保存阈值</button>
            </div>
          </div>
        </div>

        <div class="settings-panel" data-settings-panel="data" role="tabpanel" hidden>
          <div class="settings-section">
            <div class="settings-section-head">
              <div>
                <p class="eyebrow">LOCAL STATUS</p>
                <h2>系统状态</h2>
              </div>
              <button id="refreshStatus" class="button" type="button">刷新状态</button>
            </div>
            <div id="settingsStatus" class="settings-status"></div>
          </div>

          <div class="settings-section">
            <div class="settings-section-head">
              <div>
                <p class="eyebrow">BACKUPS</p>
                <h2>备份</h2>
              </div>
              <button id="createBackup" class="button-primary" type="button">创建备份</button>
            </div>
            <div id="settingsBackups" class="settings-backups"></div>
          </div>
        </div>
      </section>
    </div>

    <script src="../vendor/lucide.min.js"></script>
    <script type="module">
      import { createSettingsController } from "./settings.mjs";
      import { requestJson } from "../shared/js/api.mjs";

      const controller = createSettingsController({
        api: { requestJson },
        view: document,
        location: window.location,
        history: window.history,
        onRefresh: async () => {
          await requestJson("/api/sync", { method: "POST" });
          window.location.reload();
        },
      });
      controller.init();
      controller.load().catch((error) => console.error("设置加载失败", error));
      window.addEventListener("beforeunload", () => controller.dispose());
    </script>
  </body>
</html>
