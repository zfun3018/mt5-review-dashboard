<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>国内期货复盘 · 布局编辑器</title>
    <link rel="stylesheet" href="../vendor/gridstack.min.css" />
    <style>
      :root {
        color-scheme: light;
        --ink: #12252b;
        --muted: #6d7e83;
        --line: #dbe6e4;
        --canvas: #f5f8f7;
        --panel: #ffffff;
        --teal: #069d91;
        --teal-dark: #075f5b;
        --teal-soft: #dff5f1;
        --orange: #f49b22;
        --coral: #f05778;
        --shadow: 0 10px 26px rgba(24, 58, 61, .07), 0 2px 5px rgba(24, 58, 61, .04);
      }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); background: var(--canvas); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      button, input { font: inherit; }
      button, a { cursor: pointer; }
      .editor-page { min-height: 100vh; padding: 24px 28px 32px; }
      .editor-topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; max-width: 1440px; margin: 0 auto 22px; }
      .editor-brand { display: flex; align-items: center; gap: 12px; }
      .back-link { width: 38px; height: 38px; display: grid; place-items: center; color: var(--teal-dark); border: 1px solid var(--line); border-radius: 9px; background: var(--panel); text-decoration: none; }
      .back-link:hover { background: var(--teal-soft); }
      .back-link svg { width: 17px; height: 17px; }
      h1 { margin: 0; font-size: 22px; letter-spacing: -.03em; }
      .editor-brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
      .editor-actions { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
      .action-button, .icon-button { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; color: #496066; background: var(--panel); text-decoration: none; }
      .action-button:hover, .icon-button:hover { border-color: #9bcfc8; color: var(--teal-dark); background: var(--teal-soft); }
      .action-button.primary { color: #fff; background: var(--teal); border-color: var(--teal); font-weight: 700; }
      .action-button.primary:hover { color: #fff; background: var(--teal-dark); }
      .action-button svg, .icon-button svg { width: 15px; height: 15px; }
      .editor-layout { display: grid; grid-template-columns: minmax(0, 1fr) 286px; gap: 18px; max-width: 1440px; margin: 0 auto; }
      .workspace { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,.5); }
      .workspace-head { display: flex; justify-content: space-between; gap: 12px; padding: 4px 8px 14px; color: var(--muted); font-size: 12px; }
      .workspace-head strong { color: var(--teal-dark); }
      .grid-stack { min-height: 720px; padding: 8px; background-image: linear-gradient(rgba(6,157,145,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(6,157,145,.045) 1px, transparent 1px); background-size: calc(100% / 12) 48px; border-radius: 10px; }
      .grid-stack-item-content { overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
      .editor-card { min-width: 0; height: 100%; display: flex; flex-direction: column; }
      .editor-card-header { min-height: 46px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px 0 13px; border-bottom: 1px solid #e9f0ee; background: linear-gradient(90deg, #f8fcfb, #fff); cursor: move; }
      .editor-card-header strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
      .editor-card-header small { display: block; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
      .editor-card-title { min-width: 0; }
      .editor-card-actions { display: inline-flex; align-items: center; gap: 3px; flex: 0 0 auto; }
      .editor-card-actions button { width: 27px; height: 27px; display: grid; place-items: center; border: 0; border-radius: 6px; color: var(--muted); background: transparent; }
      .editor-card-actions button:hover { color: var(--coral); background: #fff0f3; }
      .editor-card-actions svg { width: 14px; height: 14px; }
      .editor-card-body { flex: 1; min-height: 0; padding: 13px; color: var(--muted); font-size: 11px; }
      .preview-line { height: 7px; margin: 9px 0; border-radius: 99px; background: #edf3f1; }
      .preview-line span { display: block; height: 100%; border-radius: inherit; background: var(--teal); }
      .preview-value { margin: 7px 0 13px; color: var(--teal-dark); font-size: 23px; font-weight: 800; }
      .preview-value.loss { color: var(--coral); }
      .preview-table { display: grid; gap: 8px; }
      .preview-table div { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding-bottom: 7px; border-bottom: 1px solid #eef3f1; }
      .preview-table b { color: var(--ink); font-weight: 700; }
      .preview-bars { display: flex; align-items: end; gap: 7px; height: 88px; padding-top: 10px; }
      .preview-bars i { flex: 1; min-height: 10px; border-radius: 5px 5px 2px 2px; background: var(--teal); }
      .preview-bars i:nth-child(2), .preview-bars i:nth-child(5) { background: var(--coral); }
      .preview-bars i:nth-child(3) { background: var(--orange); }
      .preview-calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .preview-calendar i { aspect-ratio: 1; border-radius: 4px; background: #e4f4f0; }
      .preview-calendar i:nth-child(3n) { background: #ffebd1; }
      .inspector { align-self: start; position: sticky; top: 18px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); }
      .inspector h2 { margin: 0; font-size: 16px; }
      .inspector-note { margin: 5px 0 18px; color: var(--muted); font-size: 11px; line-height: 1.5; }
      .field { display: grid; gap: 6px; margin-top: 13px; }
      .field label, .check-label { color: var(--muted); font-size: 11px; }
      .field input[type="text"] { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fbfdfc; outline: 0; }
      .field input[type="text"]:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
      .check-label { display: flex; align-items: center; gap: 8px; margin-top: 15px; }
      .check-label input { accent-color: var(--teal); }
      .inspector-divider { height: 1px; margin: 20px 0 14px; background: var(--line); }
      .module-list { display: grid; gap: 5px; max-height: 360px; overflow: auto; }
      .module-list button { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 8px 9px; border: 0; border-radius: 7px; color: #52666a; background: transparent; text-align: left; font-size: 11px; }
      .module-list button:hover, .module-list button.active { color: var(--teal-dark); background: var(--teal-soft); }
      .module-list button small { color: var(--muted); }
      .empty-state { padding: 20px 0; color: var(--muted); font-size: 12px; text-align: center; }
      .import-input { display: none; }
      .toast { position: fixed; right: 24px; bottom: 24px; z-index: 30; padding: 10px 13px; border: 1px solid #bce5df; border-radius: 9px; color: var(--teal-dark); background: #f1fbf9; box-shadow: var(--shadow); font-size: 12px; }
      .toast[hidden] { display: none; }
      @media (max-width: 980px) {
        .editor-layout { grid-template-columns: minmax(0, 1fr); }
        .inspector { position: static; }
      }
      @media (max-width: 640px) {
        .editor-page { padding: 14px 10px 24px; }
        .editor-topbar { align-items: flex-start; flex-direction: column; gap: 13px; }
        .editor-actions { width: 100%; justify-content: flex-start; }
        .workspace { padding: 8px; }
        .grid-stack { min-height: 520px; }
      }
    </style>
  </head>
  <body>
    <div class="editor-page">
      <header class="editor-topbar">
        <div class="editor-brand">
          <a class="back-link" id="editorBackLink" href="mock-domestic-futures.html" title="返回仪表盘" aria-label="返回仪表盘"><i data-lucide="arrow-left"></i></a>
          <div><h1>仪表盘布局编辑器</h1><p>拖动模块标题栏调整位置，拖动边缘或角点调整大小</p></div>
        </div>
        <div class="editor-actions">
          <button class="icon-button" type="button" data-layout-action="reset" title="恢复默认布局"><i data-lucide="rotate-ccw"></i>恢复默认</button>
          <button class="icon-button" type="button" data-layout-action="export" title="导出布局"><i data-lucide="download"></i>导出布局</button>
          <label class="icon-button" data-layout-action="import" title="导入布局"><i data-lucide="upload"></i>导入布局<input class="import-input" id="importInput" type="file" accept="application/json" /></label>
          <a class="action-button primary" id="applyLink" href="mock-domestic-futures.html"><i data-lucide="check"></i>完成并返回</a>
        </div>
      </header>
      <main class="editor-layout">
        <section class="workspace" aria-label="布局编辑画布">
          <div class="workspace-head"><span>编辑画布</span><strong id="layoutStatus">已保存</strong></div>
          <div class="grid-stack" id="editorGrid"></div>
        </section>
        <aside class="inspector" aria-label="模块属性">
          <h2>模块属性</h2>
          <p class="inspector-note">选中模块后，可以修改展示名称和副标题。模块 ID 保持不变，用于保存布局。</p>
          <div id="emptyInspector" class="empty-state">请选择一个模块</div>
          <div id="moduleInspector" hidden>
            <div class="field"><label for="titleInput">模块标题</label><input id="titleInput" type="text" maxlength="30" /></div>
            <div class="field"><label for="subtitleInput">副标题</label><input id="subtitleInput" type="text" maxlength="60" /></div>
            <label class="check-label"><input id="visibleInput" type="checkbox" /> 在仪表盘中显示</label>
          </div>
          <div class="inspector-divider"></div>
          <div class="module-list" id="moduleList"></div>
        </aside>
      </main>
    </div>
    <div class="toast" id="toast" hidden></div>
    <script src="../vendor/lucide.min.js"></script>
    <script src="../vendor/gridstack-all.js"></script>
    <script type="module" src="./domestic-futures-layout-editor.mjs"></script>
  </body>
</html>
