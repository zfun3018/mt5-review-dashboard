<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>复盘画册 · MT5 复盘</title>
    <link rel="stylesheet" href="../shared/css/tokens.css" />
    <link rel="stylesheet" href="../shared/css/base.css" />
    <link rel="stylesheet" href="../shared/css/shell.css" />
    <link rel="stylesheet" href="../shared/css/components.css" />
    <link rel="stylesheet" href="./album.css" />
  </head>
  <body>
    <div data-app-shell>
      <section class="panel album-random" aria-labelledby="albumRandomTitle">
        <div class="album-random-head">
          <div>
            <p class="eyebrow">RANDOM REVIEW</p>
            <h2 id="albumRandomTitle">随机阅读</h2>
          </div>
          <button id="albumRandomButton" class="button-primary album-random-button" type="button">
            <i data-lucide="shuffle" aria-hidden="true"></i>
            <span>随机一个</span>
          </button>
        </div>
        <div id="albumRandomStatus" class="album-random-status">尚未抽取画册</div>
        <div id="albumRandomResult" class="album-random-result" aria-live="polite" hidden></div>
      </section>

      <section class="panel album-checkin-panel" aria-labelledby="albumCheckinTitle">
        <div class="album-checkin-head">
          <div>
            <p class="eyebrow">READING RHYTHM</p>
            <h2 id="albumCheckinTitle">打卡热力图</h2>
          </div>
          <div class="album-checkin-goal">
            <label for="albumCheckinGoal">每日目标</label>
            <input id="albumCheckinGoal" type="number" min="1" max="500" step="1" value="20" inputmode="numeric" />
            <span>张</span>
            <button id="albumCheckinGoalSave" class="button-primary" type="button">保存目标</button>
          </div>
        </div>
        <div id="albumCheckinSummary" class="album-checkin-summary" aria-live="polite">读取打卡进度...</div>
        <div class="album-checkin-calendar-head">
          <button id="albumCheckinPrevious" class="app-icon-button" type="button" title="上个月" aria-label="上个月">
            <i data-lucide="chevron-left" aria-hidden="true"></i>
          </button>
          <strong id="albumCheckinMonthLabel">本月</strong>
          <button id="albumCheckinNext" class="app-icon-button" type="button" title="下个月" aria-label="下个月">
            <i data-lucide="chevron-right" aria-hidden="true"></i>
          </button>
        </div>
        <div id="albumCheckinMonthSummary" class="album-checkin-month-summary" aria-live="polite">本月打卡统计读取中...</div>
        <div id="albumCheckinHeatmap" class="album-checkin-heatmap" role="grid" aria-label="本月阅读打卡日历"></div>
      </section>

      <section class="panel album-toolbar" aria-label="画册筛选">
        <div class="album-toolbar-head">
          <div>
            <p class="eyebrow">CURATE THE EVIDENCE</p>
            <h2>筛选画册</h2>
          </div>
          <div class="album-toolbar-actions">
            <span id="albumFilterNote" class="album-filter-note">标签组内任选，跨组同时满足</span>
            <button id="albumClear" class="button" type="button">清空条件</button>
            <button id="albumRefresh" class="button-primary" type="button">刷新画册</button>
          </div>
        </div>
        <div class="album-basic-filters">
          <label>
            <span>品种</span>
            <select id="albumSymbol">
              <option value="">全部品种</option>
            </select>
          </label>
          <label>
            <span>开始日期</span>
            <input id="albumStart" type="date" />
          </label>
          <label>
            <span>结束日期</span>
            <input id="albumEnd" type="date" />
          </label>
          <label>
            <span>时间顺序</span>
            <select id="albumSort">
              <option value="desc">最新优先</option>
              <option value="asc">最早优先</option>
            </select>
          </label>
        </div>
        <div id="albumTagGroups" class="album-tag-groups" aria-label="标签筛选"></div>
      </section>

      <section class="album-summary-row" aria-live="polite">
        <div>
          <span class="eyebrow">CURRENT VIEW</span>
          <strong id="albumResultCount">读取中</strong>
        </div>
        <div>
          <span class="eyebrow">TRADING DAYS</span>
          <strong id="albumDayCount">-</strong>
        </div>
        <div>
          <span class="eyebrow">NET P/L</span>
          <strong id="albumNetPnl">-</strong>
        </div>
        <div id="albumError" class="album-error" role="alert" hidden></div>
      </section>

      <section class="album-section" aria-labelledby="albumViewTitle">
        <div class="album-section-head">
          <div>
            <p class="eyebrow">REVIEW ALBUM</p>
            <h2 id="albumViewTitle">复盘画册</h2>
          </div>
          <div class="album-view-tabs" role="tablist" aria-label="画册栏目">
            <button class="album-view-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="albumAllPanel" data-album-view="all">全部画册</button>
            <button class="album-view-tab" type="button" role="tab" aria-selected="false" aria-controls="albumArchivedPanel" data-album-view="archived">归档画册 <span id="albumArchivedCount">0</span></button>
          </div>
        </div>
        <div id="albumAllPanel" class="album-view-panel" role="tabpanel" aria-labelledby="albumViewTitle">
          <div id="albumDays" class="album-days" aria-live="polite"></div>
          <div id="albumEmpty" class="album-empty" hidden>
            <strong>当前条件没有交易</strong>
            <span>清空筛选后查看全部有效订单。</span>
            <button id="albumEmptyClear" class="button-primary" type="button">清空筛选</button>
          </div>
        </div>
        <div id="albumArchivedPanel" class="album-view-panel" role="tabpanel" aria-labelledby="albumViewTitle" hidden>
          <div id="albumArchivedDays" class="album-days" aria-live="polite"></div>
          <div id="albumArchivedEmpty" class="album-section-empty" hidden>
            <strong>暂无归档画册</strong>
            <span>归档后的画册会集中显示在这里。</span>
          </div>
        </div>
      </section>
      <div id="albumLoading" class="album-loading" hidden>正在读取交易截图...</div>
    </div>

    <div id="albumImageModal" class="album-image-modal" role="dialog" aria-modal="true" aria-label="画册阅读器" aria-hidden="true">
      <button id="albumImageClose" class="app-icon-button" type="button" title="关闭阅读器" aria-label="关闭阅读器">×</button>
      <div class="album-reader-shell">
        <figure class="album-reader-media">
          <img id="albumModalImage" alt="交易截图大图" />
          <figcaption id="albumModalCaption"></figcaption>
        </figure>
        <aside class="album-reader-aside" aria-label="订单信息">
          <div class="album-reader-toolbar">
            <span class="eyebrow">REVIEW READER</span>
            <div class="album-reader-toolbar-actions">
              <button id="albumReaderCheckin" class="button album-reader-checkin" type="button" data-checkin="">
                <i data-lucide="check" aria-hidden="true"></i>
                <span>打卡</span>
              </button>
              <button id="albumReaderNext" class="button-primary album-reader-next" type="button">
                <i data-lucide="shuffle" aria-hidden="true"></i>
                <span>换一个</span>
              </button>
            </div>
          </div>
          <div id="albumReaderInfo" class="album-reader-info"></div>
        </aside>
      </div>
    </div>

    <script src="../vendor/lucide.min.js"></script>
    <script type="module">
      import { createAlbumController } from "./album.mjs";
      import { requestJson } from "../shared/js/api.mjs";

      const controller = createAlbumController({
        api: { requestJson },
        view: document,
        location: window.location,
        history: window.history,
        onRefresh: async () => {
          await requestJson("/api/sync", { method: "POST" });
          window.location.reload();
        },
      });
      controller.init();
      controller.load();
      window.addEventListener("beforeunload", () => controller.dispose());
    </script>
  </body>
</html>
