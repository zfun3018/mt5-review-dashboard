<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>订单复盘 · MT5 复盘</title>
    <script src="../shared/js/platform-boot.js"></script>
    <link rel="stylesheet" href="../shared/css/tokens.css" />
    <link rel="stylesheet" href="../shared/css/base.css" />
    <link rel="stylesheet" href="../shared/css/shell.css" />
    <link rel="stylesheet" href="../shared/css/components.css" />
    <link rel="stylesheet" href="../shared/css/domestic-futures-workspace.css" />
    <link rel="stylesheet" href="./orders.css" />
  </head>
  <body>
    <div data-app-shell>
      <section class="filter-bar order-filters" aria-label="订单筛选">
        <div class="filter-bar__group search-group">
          <label for="searchInput">搜索</label>
          <input id="searchInput" type="search" placeholder="订单号 / 品种 / 备注" />
        </div>
        <div class="filter-bar__group">
          <label for="sideFilter">方向</label>
          <select id="sideFilter">
            <option value="all">全部方向</option>
            <option value="long">做多</option>
            <option value="short">做空</option>
          </select>
        </div>
        <div class="filter-bar__group">
          <label for="tradeTypeFilter">交易场景</label>
          <select id="tradeTypeFilter"><option value="all">全部类型</option></select>
        </div>
        <div class="filter-bar__group">
          <label for="strategyFilter">交易策略</label>
          <select id="strategyFilter"><option value="all">全部策略</option></select>
        </div>
        <div class="filter-bar__group">
          <label for="startFilter">开始日期</label>
          <input id="startFilter" type="date" title="开始日期" />
        </div>
        <div class="filter-bar__group">
          <label for="endFilter">结束日期</label>
          <input id="endFilter" type="date" title="结束日期" />
        </div>
        <label class="toggle-filter">
          <input id="riskMissingOnly" type="checkbox" />
          <span>仅看 R 缺失</span>
        </label>
        <div class="filter-bar__group">
          <label for="deletedFilter">订单状态</label>
          <select id="deletedFilter">
            <option value="active">有效订单</option>
            <option value="deleted">已排除订单</option>
          </select>
        </div>
      </section>

      <section id="orderRegion" class="region-anchor" aria-live="polite"></section>

      <div class="orders-layout">
        <div class="orders-index-column">
          <article class="panel trades-panel">
            <div class="panel-head orders-panel-head">
              <div>
                <p class="eyebrow">ORDERS</p>
                <h2>订单复盘</h2>
              </div>
              <div class="orders-list-views" role="tablist" aria-label="订单范围">
                <button id="orderViewAll" class="view-tab active" type="button" role="tab" aria-selected="true" data-order-view="all">全部订单</button>
                <button id="orderViewFeatured" class="view-tab" type="button" role="tab" aria-selected="false" data-order-view="featured">精选订单</button>
              </div>
            </div>
            <div class="table-wrap">
              <table class="orders-table">
                <thead id="orderHead"></thead>
                <tbody id="orderRows"></tbody>
              </table>
            </div>
            <div class="pagination">
              <span id="orderTotal" class="pagination-total"></span>
              <div class="pagination-controls">
                <button id="orderPrev" class="app-icon-button" type="button" title="上一页" aria-label="上一页">&lt;</button>
                <span id="orderPage"></span>
                <button id="orderNext" class="app-icon-button" type="button" title="下一页" aria-label="下一页">&gt;</button>
              </div>
            </div>
          </article>
          <article class="panel checkin-calendar-panel" aria-labelledby="checkinCalendarTitle">
            <div class="checkin-calendar-head">
              <h3 id="checkinCalendarTitle">打卡日历</h3>
              <span id="checkinCalendarSummary" class="muted-mini">读取中</span>
            </div>
            <div id="checkinCalendar" class="checkin-calendar" role="grid" aria-label="订单复盘打卡日历"></div>
          </article>
        </div>

        <article class="panel detail-panel">
          <div id="orderDetail" class="detail-host"></div>
        </article>
      </div>
    </div>

    <div id="imageModal" class="image-modal" role="dialog" aria-modal="true" aria-label="截图预览" aria-hidden="true">
      <button id="imageClose" class="app-icon-button" type="button" title="关闭" aria-label="关闭">×</button>
      <img id="modalImage" alt="截图预览" />
    </div>

    <script src="../vendor/lucide.min.js"></script>
    <script src="../vendor/html2canvas.min.js"></script>
    <script src="../r-multiple.js"></script>
    <script type="module">
      import { createOrdersController } from "./orders.mjs";
      import { requestJson } from "../shared/js/api.mjs";
      import { readPlatform, withPlatform } from "../shared/js/platform.mjs";

      const platform = readPlatform(window.location);

      const controller = createOrdersController({
        api: { requestJson },
        view: document,
        location: window.location,
        history: window.history,
        platform,
        onRefresh: async () => {
          if (platform === "domestic_futures") {
            window.location.href = withPlatform("/settings/?tab=data", platform);
            return;
          }
          await requestJson("/api/sync", { method: "POST" });
          window.location.reload();
        },
      });
      controller.init();
      controller.load();
      window.addEventListener("beforeunload", () => controller.dispose());
    </script>
  </body>
</html>
