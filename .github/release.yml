changelog:
  exclude:
    labels:
      - dependencies
  categories:
    - title: 功能与改进
      labels:
        - feature
        - enhancement
    - title: 修复
      labels:
        - fix
        - bug
    - title: 文档与维护
      labels:
        - documentation
        - docs
        - chore
    - title: 其他变更
      labels:
        - "*"
