name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-and-publish:
    name: Verify and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark package
        working-directory: mt5-review-system
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet --no-deps .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mt5-review-system/package-lock.json

      - name: Install Node dependencies
        working-directory: mt5-review-system
        run: npm ci --no-audit --no-fund

      - name: Verify tag matches VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit(f"VERSION is not SemVer: {version!r}")
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match VERSION; expected {expected!r}")
          print(f"Verified {tag} against VERSION")
          PY

      - name: Run release checks
        working-directory: mt5-review-system
        run: python tools/check_release.py --skip-browser

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --verify-tag
          --title "MT5 复盘仪表盘 ${{ github.ref_name }}"
          --generate-notes
